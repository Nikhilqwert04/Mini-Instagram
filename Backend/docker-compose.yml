services:
  redis:
    image: redis:7-alpine
    container_name: redis-instagram
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  mongo:
    image: mongo:7
    container_name: mongo-instagram
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: INSTAGRAM_REDIS
    volumes:
      - mongo-data:/data

volumes:
  redis-data:
  mongo-data: